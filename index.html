:root{color-scheme:dark;--bg:#1e1a17;--fld:#28231f;--fg:#ece4da;--mut:#9d9186;--ac:#c9a27a;--st:#3a332d;--th:#2f2924;--warn:#ff8f7f;--soon:#f0b350}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 Inter,system-ui,sans-serif}
body{padding:0 12px calc(70px + env(safe-area-inset-bottom))}
h1{margin:0 -12px 12px;padding:calc(16px + env(safe-area-inset-top)) 16px 14px;border-bottom:0.5px solid var(--st);font:600 24px/1.2 Inter,system-ui,sans-serif;letter-spacing:-.2px;display:flex;justify-content:space-between;align-items:center}
input,select,textarea{width:100%;font:inherit;color:inherit;background:var(--fld);border:1px solid transparent;border-radius:2px;padding:10px;margin:0 0 12px}

const skD=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1]);

 const a=skNew({k:'a',L:3,ref:it.id,poly:it.pts.map(q=>q.slice()),par:Object.assign({},sk.sa),c:sk.st.c});skSelId=a.id;skCommit();skPanelR()}
function skSetTool(t){skTool=t;if(t!=='sel')skSelId=null;skMeas=t==='meas'?skMeas:null;skPanelR();skInv=true;skFrame()}
function skColor(i){const c=SKC[i];sk.st.c=c;const it=skSel();if(it){it.c=c;skCommit()}else save();skPanelR()}
function skWidth(i){sk.st.w=i;const it=skSel();if(it&&it.k==='p'){it.w=SKW[i][1];skCommit()}else save();skPanelR()}
function skStyle(s){sk.st.sty=s;const it=skSel();if(it&&it.k==='p'){it.sty=s;skCommit()}else save();skPanelR()}
function skLayer(i){sk.act=i;save();skPanelR()}
function skVis(i){sk.lay[i].v=sk.lay[i].v?0:1;save();skInv=true;skPanelR();skFrame()}
function skLock(i){sk.lay[i].l=sk.lay[i].l?0:1;save();skPanelR()}
function skTog(k){sk.st[k]=sk.st[k]?0:1;save();skInv=true;skPanelR();skFrame()}
function skTouchMode(){const o=['auto','pan','draw'],n=o[(o.indexOf(sk.st.tm)+1)%3];sk.st.tm=n;save();skPanelR()}
function skStampSel(t){sk.stp=t;save();skPanelR()}
function skFillSel(t){sk.fl=t;const it=skSel();if(it&&it.k==='p'&&it.cl){if(t==='none')delete it.fill;else it.fill={t,c:sk.st.c};skCommit()}else save();skPanelR()}
function skSetSA(k,v){const it=skSel();if(k==='cell'&&it&&it.k==='a'&&!skSAok(it.poly,v)){toast('Too fine for a shape this big. Pick a larger size.');return}sk.sa[k]=v;if(it&&it.k==='a'){it.par[k]=v;skCommit()}else save();skPanelR()}
function skDel(){const it=skSel();if(!it)return;sk.items=sk.items.filter(x=>x!==it);skSelId=null;skCommit();skPanelR()}
function skCopy(){const it=skSel();if(!it)return;const c=JSON.parse(JSON.stringify(it));c.id=uid();if(c.k==='a')c.ref=null;skMoveIt(c,0.25,0.25);sk.items.push(c);skSelId=c.id;skCommit();skPanelR()}
function skRotBtn(d){const it=skSel();if(!it)return;skRotIt(it,d*Math.PI/180);skCommit()}
function skScaleBtn(f){const it=skSel();if(!it)return;skScaleIt(it,f);skCommit()}
function skEditText(){const it=skSel();if(it&&it.k==='t')skAskText(null,it)}
function skTogPanel(){skPanel=!skPanel;skPanelR();skBar()}
function skDupSketch(){const c=JSON.parse(JSON.stringify(sk));c.id=uid();c.name=(sk.name||'Untitled sketch')+' copy';c.t=Date.now();db.sketches.push(c);save();toast('Duplicated. Find it in Sketches.')}
function skDelSketch(){ask('Move this sketch to Trash? You can restore it for 30 days.','Move to Trash',()=>{const s=sk;toTrash('sketch',s);db.sketches=db.sketches.filter(x=>x!==s);skClose(true)})}
// ---------- bar + panel
function skBar(){const b=document.getElementById('skt');if(!b)return;
 b.innerHTML='<button onclick="skClose()" aria-label="Back to Sketches">&#8249;</button><button class="nm" onclick="skRename()">'+esc(sk.name||'Untitled sketch')+'</button>'+
 '<button onclick="skUndo()" aria-label="Undo"'+(skHi>0?'':' disabled')+'>&#8630;</button><button onclick="skRedo()" aria-label="Redo"'+(skHi<skHist.length-1?'':' disabled')+'>&#8631;</button>'+
 '<button onclick="skZoom(1/1.25)" aria-label="Zoom out">&minus;</button><button onclick="skZoom(1.25)" aria-label="Zoom in">+</button><button onclick="skFit()">Fit</button><button onclick="skTogPanel()" aria-label="Tools">'+(skPanel?'&#9652;':'&#9662;')+'</button>'}
function skPanelR(){const p=document.getElementById('skp');if(!p)return;p.classList.toggle('on',skPanel);if(!skPanel){p.innerHTML='';return}
 const B=(on,fn,l,x)=>'<button class="'+(on?'on':'')+'" onclick="'+fn+'">'+l+'</button>',R=h=>'<div class="skr">'+h+'</div>',T=l=>'<div class="skl">'+l+'</div>';
 const it=skSel(),st=sk.st;let h='';
 h+=T('Tools')+R(SKTOOL.map(t=>B(skTool===t[0],"skSetTool('"+t[0]+"')",t[1])).join(''))+'<div class="skh">'+(SKHINT[skTool]||'')+'</div>';
 if(it)h+=T('Selected')+R(B(0,'skDel()','Delete')+B(0,'skCopy()','Copy')+B(0,'skRotBtn(-15)','Rotate &#8634;')+B(0,'skRotBtn(15)','Rotate &#8635;')+B(0,'skScaleBtn(1/1.15)','Smaller')+B(0,'skScaleBtn(1.15)','Bigger')+(it.k==='t'?B(0,'skEditText()','Edit text'):''));
 h+=T('Color'+(it?' (applies to selection)':''))+R(SKC.map((c,i)=>'<button class="skw'+(st.c===c?' on':'')+'" title="'+SKCN[i]+'" style="background:'+c+'" onclick="skColor('+i+')"></button>').join(''));
 h+=T('Line')+R(SKW.map((w,i)=>B(st.w===i,'skWidth('+i+')',w[0])).join('')+SKSTY.map(s=>B(st.sty===s[0],"skStyle('"+s[0]+"')",s[1])).join(''));
 if(skTool==='stamp')h+=T('Stamp')+R(SKSTAMP.map(s=>B(sk.stp===s[0],"skStampSel('"+s[0]+"')",s[1])).join(''));
 if(skTool==='fill'||(it&&it.k==='p'&&it.cl))h+=T('Fill style (applied with the color above)')+R(SKFILL.map(f=>B(sk.fl===f[0],"skFillSel('"+f[0]+"')",f[1])).join(''));
 if(skTool==='sash'||(it&&it.k==='a')){const sa=it&&it.k==='a'?it.par:sk.sa;
  h+=T('Sashiko pattern')+R(SKPAT.map(q=>B(sa.pat===q[0],"skSetSA('pat','"+q[0]+"')",q[1])).join(''))+
  T('Pattern size')+R([0.25,0.375,0.5,0.75,1,1.5].map(v=>B(Math.abs(sa.cell-v)<1e-6,'skSetSA(\'cell\','+v+')',skFmt(v))).join(''))+
  T('Pattern angle')+R([0,15,30,45,60,90].map(v=>B((sa.rot||0)===v,'skSetSA(\'rot\','+v+')',v+'&deg;')).join(''))+
  T('Stitch length')+R([[0.08,'Short'],[0.12,'Medium'],[0.18,'Long']].map(v=>B(Math.abs(sa.stl-v[0])<1e-6,'skSetSA(\'stl\','+v[0]+')',v[1])).join(''))}
 h+=T('Layers (tap a name to draw on it)')+sk.lay.map((l,i)=>'<div class="skly'+(sk.act===i?' on':'')+'"><button class="n" onclick="skLayer('+i+')">'+SKLAY[i]+'</button><button onclick="skVis('+i+')">'+(l.v?'Shown':'Hidden')+'</button><button onclick="skLock('+i+')">'+(l.l?'Locked':'Free')+'</button></div>').join('');
 h+=T('Drawing aids')+R(B(st.gr,"skTog('gr')",'Dot grid')+B(st.sn,"skTog('sn')",'Snap to dots')+B(st.str,"skTog('str')",'Straighten')+B(0,'skTouchMode()','Fingers: '+({auto:'Auto',pan:'Move only',draw:'Draw'}[st.tm]||'Auto')))+'<div class="skh">One dot is 1/4 inch. Straighten cleans up lines, curves and corners when you lift the pen. Fingers: Auto lets the S Pen draw and fingers move the view. Pressing the S Pen side button opens and closes this menu; the eraser end of the pen erases.</div>';
 h+=T('Sketch')+R(B(0,'skRename()','Rename')+B(0,'skDupSketch()','Duplicate')+B(0,'skExport()','Save picture')+'<button class="del" onclick="skDelSketch()">Delete</button>');
 p.innerHTML=h}
// ---------- links from notes
function ins(h,rg){const b=$('#body');if(!b)return;b.focus();if(rg){const s=getSelection();s.removeAllRanges();s.addRange(rg)}document.execCommand('insertHTML',false,h);sync()}
function pickSk(){if(!db.sketches.length)return say('No sketches yet. Make one in the Sketches tab, then link it here.');
 const s=getSelection(),rg=s&&s.rangeCount&&$('#body')&&$('#body').contains(s.anchorNode)?s.getRangeAt(0).cloneRange():null;
 const d=document.createElement('div');d.className='dlg';const L=db.sketches.slice().sort((a,b)=>b.t-a.t);
 d.innerHTML='<div class="box"><p>Link which sketch?</p><div style="max-height:50vh;overflow:auto;margin-bottom:12px">'+L.map(x=>'<button class="btn" style="width:100%;text-align:left;margin-bottom:6px" data-id="'+x.id+'">'+esc(x.name||'Untitled sketch')+'</button>').join('')+'</div><div class="row"><button class="btn" id="dn">Cancel</button></div></div>';
 document.body.append(d);d.querySelector('#dn').onclick=()=>d.remove();
 d.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{const x=db.sketches.find(y=>y.id===b.dataset.id);d.remove();if(x)ins('<a class="skk" data-sk="'+x.id+'">&#9998; '+esc(x.name||'Untitled sketch')+'</a>&nbsp;',rg)})}
document.addEventListener('click',e=>{const a=e.target.closest&&e.target.closest('a.skk');if(a&&!skOpen){e.preventDefault();openSk(a.dataset.sk)}});

init();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script></body></html>
