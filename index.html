:root{color-scheme:dark;--bg:#1e1a17;--fld:#28231f;--fg:#ece4da;--mut:#9d9186;--ac:#c9a27a;--st:#3a332d;--th:#2f2924;--warn:#ff8f7f;--soon:#f0b350}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 Inter,system-ui,sans-serif}
body{padding:0 12px calc(70px + env(safe-area-inset-bottom))}
h1{margin:0 -12px 12px;padding:calc(16px + env(safe-area-inset-top)) 16px 14px;border-bottom:0.5px solid var(--st);font:600 24px/1.2 Inter,system-ui,sans-serif;letter-spacing:-.2px;display:flex;justify-content:space-between;align-items:center}
input,select,textarea{width:100%;font:inherit;color:inherit;background:var(--fld);border:1px solid transparent;border-radius:2px;padding:10px;margin:0 0 12px}
input:focus,textarea:focus,select:focus,#body:focus{outline:1.5px solid var(--ac);outline-offset:-1px}
label{display:block;font:500 12px Inter,system-ui,sans-serif;color:var(--mut);margin-bottom:4px}

function delProd(){ask('Move this product to Trash? You can restore it for 30 days. Inventory is not affected.','Move to Trash',()=>{toTrash('prod',curP);db.prods=db.prods.filter(p=>p!==curP);save();view='prods';render()})}
function setPt(t){pt=t;render()}
function newChg(){curC={id:uid(),date:td(),what:'',why:'',fit:''};curP.changes.push(curC);view='chg';render()}
function openChg(i){curC=curP.changes.find(x=>x.id===i);view='chg';render()}
function delChg(){ask('Delete this change entry?','Delete',()=>{curP.changes=curP.changes.filter(x=>x!==curC);save();view='prod';pt='changes';render()})}
function addMat(){const i=$('#mi').value,a=parseFloat($('#ma').value);if(!i)return say('Choose a material first.');if(!(a>0))return say('Enter how much one product uses.');
 const e=curP.mats.find(x=>x.inv===i);if(e)e.amt=String(Math.round((+e.amt+a)*1e4)/1e4);else curP.mats.push({id:uid(),inv:i,amt:String(a)});save();render()}
function setAmt(i,v){const x=curP.mats.find(y=>y.id===i);x.amt=v;save();render()}
function rmMat(i){curP.mats=curP.mats.filter(x=>x.id!==i);save();render()}
function stk(d){curP.stock=String(Math.max(0,(parseInt(curP.stock)||0)+d));$('#sk').value=curP.stock;save()}
function addSpec(){curP.specs.push({k:'',v:''});save();render()}
function rmSpec(i){curP.specs.splice(i,1);save();render()}
let snaps=[],dret='alerts',iret='inv',curR=null;
const KIND={note:'Note',prod:'Product',inv:'Inventory item',folder:'Folder',rem:'Reminder'},LIST={note:'notes',prod:'prods',inv:'inv',folder:'folders',rem:'rems'};
const fmtD=d=>new Date(d+'T00:00').toLocaleDateString();
const ago=t=>{const d=Math.floor((Date.now()-t)/864e5);return d<1?'today':d===1?'yesterday':d+' days ago'};
const cnts=d=>d.notes.length+' notes, '+d.prods.length+' products, '+d.inv.length+' inventory items';
const hasData=()=>db.notes.length||db.prods.length||db.inv.length;
const bkDue=()=>hasData()&&(!db.bk||!db.bk.last||Date.now()-db.bk.last>7*864e5);
const remDue=r=>!r.done&&r.due&&days(r.due)<=7;
const alertN=()=>db.inv.filter(attn).length+db.rems.filter(remDue).length+(bkDue()?1:0);
const bnr=()=>'<div class="bnr" onclick="go(\'bk\')"><span>'+(db.bk&&db.bk.last?'Last backup '+ago(db.bk.last):'You have not backed up yet')+'</span><b>Back up now</b></div>';
const remCard=r=>{const d=r.due?days(r.due):null,p=db.prods.find(x=>x.id===r.prod);
 const b=r.done?'<span class="b">Done</span>':d===null?'':d<0?'<span class="b w">Overdue '+(-d)+'d</span>':d===0?'<span class="b w">Today</span>':d<=3?'<span class="b s">In '+d+' days</span>':'<span class="b">'+esc(fmtD(r.due))+'</span>';
 return '<div class="card" onclick="openRem(\''+r.id+'\')">'+b+'<b'+(r.done?' style="color:var(--mut);text-decoration:line-through"':'')+'>'+esc(r.title||'Untitled reminder')+'</b><small>'+esc([r.due?fmtD(r.due):'',p?p.name:'',r.qty?'Qty '+r.qty:''].filter(Boolean).join(' · '))+'</small>'+(r.done?'':'<button class="btn" style="margin-top:8px" onclick="event.stopPropagation();doneRem(\''+r.id+'\')">Mark done</button>')+'</div>'};
function purge(){db.trash=db.trash.filter(e=>Date.now()-e.t<30*864e5)}
function toTrash(kind,item,extra){db.trash.push(Object.assign({id:uid(),kind:kind,item:item,t:Date.now()},extra||{}))}
function restore(i){const e=db.trash.find(x=>x.id===i);if(!e)return;const L=db[LIST[e.kind]];
 if(e.kind==='note'&&e.item.folder&&!db.folders.some(f=>f.id===e.item.folder))e.item.folder='';
 if(!L.some(x=>x.id===e.item.id))L.push(e.item);
 if(e.kind==='folder')(e.ids||[]).forEach(id=>{const n=db.notes.find(x=>x.id===id);if(n&&!n.folder)n.folder=e.item.id});
 db.trash=db.trash.filter(x=>x!==e);save();render()}
function killTrash(i){ask('Delete this for good? This cannot be undone.','Delete forever',()=>{db.trash=db.trash.filter(x=>x.id!==i);save();render()})}
function emptyTrash(){ask('Delete everything in Trash for good? This cannot be undone.','Empty trash',()=>{db.trash=[];save();render()})}
async function takeSnap(force){if(!hasData())return;if(!force&&snaps.length&&Date.now()-snaps[0].t<20*36e5)return;snaps.unshift({t:Date.now(),s:JSON.stringify(db)});snaps=snaps.slice(0,3);try{await idbSet('snaps',snaps)}catch(e){}}
async function replaceAll(d){await takeSnap(true);db=d;await flush();render()}
function restoreSnap(i){const s=snaps[i];if(!s)return;ask('Restore the copy from '+new Date(s.t).toLocaleString()+'? Your current data is saved as a new copy first.','Restore',()=>replaceAll(norm(JSON.parse(s.s))))}
async function doBackup(){const s=JSON.stringify(db),name='pocket-docs-backup-'+td()+'.json';
 try{const f=new File([s],name,{type:'application/json'});
  if(navigator.canShare&&navigator.canShare({files:[f]}))await navigator.share({files:[f],title:'Pocket Docs backup'});
  else{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([s],{type:'application/json'}));a.download=name;a.click()}
  db.bk={last:Date.now()};save();render();say('Backup created. Keep the file somewhere safe, like Google Drive.')}
 catch(e){if(e&&e.name==='AbortError')return;say('Could not create the backup. Try again.')}}
function newRem(){curR={id:uid(),title:'',due:td(),prod:'',qty:'',notes:'',done:false};db.rems.push(curR);view='rem';render()}
function openRem(i){curR=db.rems.find(r=>r.id===i);view='rem';render()}
function doneRem(i){const r=db.rems.find(x=>x.id===i);r.done=true;save();render()}
function toggleDone(){curR.done=!curR.done;save();view='alerts';render()}
function delRem(){ask('Move this reminder to Trash? You can restore it for 30 days.','Move to Trash',()=>{toTrash('rem',curR);db.rems=db.rems.filter(r=>r!==curR);save();view='alerts';render()})}
function icsFor(r){const e=s=>String(s||'').replace(/\\/g,'\\\\').replace(/;/g,'\;').replace(/,/g,'\\,').replace(/\r?\n/g,'\\n');
 const nx=new Date(r.due+'T00:00');nx.setDate(nx.getDate()+1);
 const d1=nx.getFullYear()+String(nx.getMonth()+1).padStart(2,'0')+String(nx.getDate()).padStart(2,'0');
 const p=db.prods.find(x=>x.id===r.prod),t=e(r.title||'Reminder'),desc=[p?p.name:'',r.qty?'Qty '+r.qty:'',r.notes].filter(Boolean).join(' - ');
 const al=tr=>['BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+t,'TRIGGER:'+tr,'END:VALARM'];
 return ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Pocket Docs//EN','BEGIN:VEVENT','UID:'+r.id+'@pocketdocs','DTSTAMP:'+new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+/,''),'DTSTART;VALUE=DATE:'+r.due.replace(/-/g,''),'DTEND;VALUE=DATE:'+d1,'SUMMARY:'+t,'DESCRIPTION:'+e(desc)].concat(al('-PT15H'),al('PT9H'),['END:VEVENT','END:VCALENDAR']).join('\r\n')}
function calRem(){if(!curR.due)return say('Set a due date first.');
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([icsFor(curR)],{type:'text/calendar'}));a.download='reminder.ics';a.click();
 say('Open the downloaded file to add this to your calendar. It asks for alerts at 9 am the day before and at 9 am that day, though your calendar app may use its own default reminders.')}
const nextName=n=>{n=(n||'Untitled').trim();const m=n.match(/^(.*?)\s*v(\d+)$/i);const b=m?m[1]:n;let k=m?+m[2]+1:2;while(db.prods.some(p=>p.name===b+' v'+k))k++;return b+' v'+k};
function spinOff(){const o=curP;ask('Create a spin-off of "'+(o.name||'Untitled')+'"? It keeps the specs, materials, and price. The change log, notes, stock, and Etsy link start fresh.','Create spin-off',()=>{
 const now=Date.now(),on=o.name||'Untitled';
 const p={id:uid(),name:nextName(o.name),type:o.type,status:'Prototyping',price:o.price,stock:'',etsy:'',specs:o.specs.map(s=>({k:s.k,v:s.v})),html:'<p>Spun off from <b>'+esc(on)+'</b> on '+fmtD(td())+'.</p>',changes:[{id:uid(),date:td(),what:'Spun off from '+on,why:'',fit:''}],mats:o.mats.map(x=>({id:uid(),inv:x.inv,amt:x.amt})),from:o.id,fromName:on,t:now};
 db.prods.push(p);curP=p;save();pt='notes';view='prod';render()})}
function sync(){const o=view==='prod'?curP:cur;o.html=$('#body').innerHTML;o.t=Date.now();save()}
function openNote(i){cur=db.notes.find(n=>n.id===i);ret=view==='folder'?'folder':'notes';view='edit';render()}
function newNote(){ret=view==='folder'?'folder':'notes';cur={id:uid(),title:'',html:'',folder:ret==='folder'?curF.id:'',t:Date.now()};db.notes.push(cur);view='edit';render();$('#title').focus()}
function delNote(){ask('Move this note to Trash? You can restore it for 30 days.','Move to Trash',()=>{toTrash('note',cur);db.notes=db.notes.filter(n=>n!==cur);save();view=ret;render()})}
function back(){
 if(view==='edit'){if(!cur.title&&!strip(cur.html).trim()&&!cur.html.includes('<table'))db.notes=db.notes.filter(n=>n!==cur);view=ret}
 else if(view==='fedit'){if(!curF.name.trim())curF.name='Untitled folder';view=fret}
 else if(view==='folder')view='notes';
 else if(view==='chg'){if(!curC.what&&!curC.why&&!curC.fit)curP.changes=curP.changes.filter(x=>x!==curC);view='prod';pt='changes'}
 else if(view==='prod'){if(!curP.name&&!strip(curP.html).trim()&&!curP.html.includes('<table')&&!curP.changes.length&&!curP.mats.length&&!curP.specs.length&&curP.price===''&&curP.stock===''&&!curP.etsy)db.prods=db.prods.filter(p=>p!==curP);view='prods'}
 else if(view==='rem'){if(!curR.title&&!curR.notes)db.rems=db.rems.filter(r=>r!==curR);view='alerts'}
 else if(view==='bk'||view==='trash')view=dret
 else{if(!cur.name&&!cur.notes)db.inv=db.inv.filter(x=>x!==cur);view=iret}
 save();render()}
function tbl(){$('#body').focus();document.execCommand('insertHTML',false,'<table><tr><th>Col 1</th><th>Col 2</th><th>Col 3</th></tr><tr><td><br></td><td><br></td><td><br></td></tr></table><p><br></p>');sync()}
function cell(){const s=getSelection();let n=s.anchorNode;n=n&&(n.nodeType===1?n:n.parentElement);return n&&n.closest&&n.closest('#body td,#body th')}
function addRow(){const c=cell();if(!c)return say('Tap inside a table cell first.');const r=c.parentElement,n=document.createElement('tr');
 for(let i=0;i<r.cells.length;i++){const d=document.createElement('td');d.innerHTML='<br>';n.append(d)}r.after(n);sync()}
function addCol(){const c=cell();if(!c)return say('Tap inside a table cell first.');const i=c.cellIndex;
 c.closest('table').querySelectorAll('tr').forEach(r=>{const h=r.cells[0].tagName==='TH',d=document.createElement(h?'th':'td');d.innerHTML=h?'Col':'<br>';r.cells[Math.min(i,r.cells.length-1)].after(d)});sync()}

function imp(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);if(!j||typeof j!=='object'||!Array.isArray(j.notes))throw 0;const d=norm(j);ask('This backup has '+cnts(d)+'. Replace everything on this phone with it? A copy of your current data is kept under Automatic copies.','Restore',()=>replaceAll(d))}catch(e){say('That is not a valid backup file.')}};r.readAsText(f)}
init();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script></body></html>
